[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsafe-local-demo"
version = "0.0.1.dev0"
description = "Private experimental local checks for screenshots and debugging logs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11,<13",
  "rich>=13,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
agentsafe = "agentsafe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ocr: real local Tesseract integration"]
