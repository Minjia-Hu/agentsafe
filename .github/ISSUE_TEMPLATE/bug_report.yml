name: Bug report
description: Report an installation, review or detection problem with fictional data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use fictional data only. Do not attach private screenshots, logs, valid tokens or sensitive filenames.
        For service-access bypasses or unexpected data exposure, follow SECURITY.md instead.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: What did you try, and what happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce with fictional data
      description: Prefer a bundled example or a small synthetic case. Do not paste a private report.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python and Tesseract versions, AgentSafe commit/version, browser if relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This report contains only fictional or intentionally public information, with no real credentials or private artifacts.
          required: true
