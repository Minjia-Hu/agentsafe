name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Resolve runtime dependencies
        run: |
          python -m pip install .
          python -m pip freeze --exclude agentsafe-local-demo > "$RUNNER_TEMP/agentsafe-dependencies.txt"
      - run: python -m pip install pip-audit
      - name: Audit exact installed versions
        run: python -m pip_audit -r "$RUNNER_TEMP/agentsafe-dependencies.txt" --no-deps --disable-pip --strict --progress-spinner off
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
          - os: macos-14
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install English OCR on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install English OCR on macOS
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install development dependencies
        run: python -m pip install '.[dev]' build
      - name: Verify OCR and behavior
        run: |
          agentsafe doctor
          python -m pytest -q --junitxml="$RUNNER_TEMP/agentsafe-tests.xml"
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'agentsafe-tests.xml')).getroot()
          skipped = sum(int(suite.get('skipped', 0)) for suite in root.iter('testsuite'))
          if skipped:
              raise SystemExit(f'{skipped} tests skipped; OCR validation is required in CI.')
          PY
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check the installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agentsafe-installed"
          "$RUNNER_TEMP/agentsafe-installed/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/agentsafe-installed/bin/agentsafe" doctor
          "$RUNNER_TEMP/agentsafe-installed/bin/agentsafe" demo --no-open
          "$RUNNER_TEMP/agentsafe-installed/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"
